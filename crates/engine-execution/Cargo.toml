[package]
name = "engine-execution"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
engine-types = { path = "../engine-types" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
